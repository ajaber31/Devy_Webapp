    <path d="M30 8c-4-2-9-1-12 2 2 0 7 0 12-2z" fill="#5C8651"/>
    <path d="M22 12c-9 0-16 9-16 20 0 14 11 28 18 28 7 0 7-4 13-4s8 4 13 4 16-14 16-28c0-9-6-16-13-18-5-1-9 3-12 3s-9-5-19-5z" fill="#D9342A"/>
